{% extends "layout.html" %}
{% block sidebar %}{% endblock %}
{% block content %}
    <div class="card empty-state">
        <h1 class="post-title">404 — Page not found</h1>
        {% if url_for is defined %}
        <img src="{{ url_for('static', filename='cat_error.png') }}" alt="" style="max-width:280px;margin:1rem auto;display:block;opacity:0.85">
        {% endif %}
        <p>The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('main.home') }}" class="btn-primary-custom" style="display:inline-block;margin-top:0.5rem">Go home</a>
    </div>
{% endblock content %}
